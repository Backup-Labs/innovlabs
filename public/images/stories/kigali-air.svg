    <rect x="40" y="30" width="160" height="40" rx="8" fill="#0B2B2E" />
    <text x="55" y="55" font-family="'Manrope', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">Kigali CleanAir IoT</text>
    <text x="55" y="245" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#B8E3D7">140 Hyperlocal Sensors • PM2.5 Live Telemetry</text>
  </g>
