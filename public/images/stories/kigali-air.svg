    <path d="M60 200 L160 120 L260 160 L360 80 L420 140" stroke="#F2A900" stroke-width="3" stroke-dasharray="6 4" />
    <circle cx="60" cy="200" r="10" fill="#F2A900" />
    <circle cx="160" cy="120" r="12" fill="#2B8CBE" />
    <circle cx="260" cy="160" r="8" fill="#137A64" />
    <circle cx="360" cy="80" r="14" fill="#F2A900" />
