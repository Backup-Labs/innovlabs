<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <rect width="600" height="380" rx="12" fill="#0B2B2E" />
  <circle cx="500" cy="80" r="140" fill="#0F5C4D" fill-opacity="0.3" />
  <circle cx="120" cy="300" r="100" fill="#2B8CBE" fill-opacity="0.2" />
  
  <!-- Stylized Air Quality Sensor Network -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="480" height="280" rx="16" fill="#133D41" stroke="#1D4E53" stroke-width="2" />
    
