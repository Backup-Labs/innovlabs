<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" fill="none">
  <!-- Classical engraving of watermill and architectural aqueduct -->
  <defs>
    <linearGradient id="sky-haze" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C2CBD0" />
      <stop offset="50%" stop-color="#E2DCD2" />
      <stop offset="100%" stop-color="#D5CEBF" />
    </linearGradient>
    <linearGradient id="stone-facade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A59B8B" />
      <stop offset="100%" stop-color="#736A5D" />
    </linearGradient>
  </defs>

  <!-- Sky and background hills -->
  <rect width="600" height="375" fill="url(#sky-haze)" />
  <path d="M0 240 Q 140 180, 280 230 T 600 210 L 600 375 L 0 375 Z" fill="#8C9388" opacity="0.4" />

  <!-- Classical Aqueduct Arches in background -->
  <g stroke="#64615B" stroke-width="2" fill="#9B968B" opacity="0.7">
    <!-- Aqueduct Pillars -->
    <path d="M120 220 L 120 280 M 160 220 L 160 280 M 200 220 L 200 280 M 240 220 L 240 280 M 280 220 L 280 280 M 320 220 L 320 280 M 360 220 L 360 280 M 400 220 L 400 280" />
    <path d="M100 220 L 420 220" stroke-width="5" />
    <!-- Arches -->
    <path d="M120 235 A 20 20 0 0 1 160 235 A 20 20 0 0 1 200 235 A 20 20 0 0 1 240 235 A 20 20 0 0 1 280 235 A 20 20 0 0 1 320 235 A 20 20 0 0 1 360 235 A 20 20 0 0 1 400 235" fill="none" />
  </g>

  <!-- Massive Watermill Wheel -->
  <g transform="translate(420, 250)">
    <circle cx="0" cy="0" r="85" fill="#423932" />
    <circle cx="0" cy="0" r="78" fill="#584C43" />
    <circle cx="0" cy="0" r="70" fill="none" stroke="#251E19" stroke-width="4" />
    <circle cx="0" cy="0" r="25" fill="#251E19" />
    <!-- Wheel Spokes -->
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#8A7A6D" stroke-width="5" />
    <line x1="0" y1="-70" x2="0" y2="70" stroke="#8A7A6D" stroke-width="5" />
    <line x1="-50" y1="-50" x2="50" y2="50" stroke="#8A7A6D" stroke-width="5" />
    <line x1="-50" y1="50" x2="50" y2="-50" stroke="#8A7A6D" stroke-width="5" />
    <!-- Water Splashes -->
    <path d="M-60 60 Q -40 75, -20 65 Q 0 85, 20 70 Q 40 85, 60 70" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.6" />
  </g>

  <!-- Architectural Mill Building / Stone Masonry -->
  <path d="M410 130 L 580 130 L 600 170 L 600 375 L 390 375 L 390 190 Z" fill="url(#stone-facade)" stroke="#2F2923" stroke-width="2" />
  <!-- Roof -->
  <polygon points="390,130 500,70 600,130" fill="#683C2F" stroke="#251713" stroke-width="2" />
  <!-- Windows with wooden shutters -->
  <rect x="440" y="150" width="35" height="50" rx="3" fill="#1C1814" stroke="#D3C7B6" stroke-width="2" />
  <rect x="520" y="150" width="35" height="50" rx="3" fill="#1C1814" stroke="#D3C7B6" stroke-width="2" />

  <!-- Wooden Scaffold & Laborers -->
  <rect x="480" y="220" width="120" height="15" fill="#5E4E40" stroke="#2F251E" stroke-width="2" />
  <line x1="510" y1="235" x2="510" y2="350" stroke="#3E332A" stroke-width="6" />
  <line x1="570" y1="235" x2="570" y2="350" stroke="#3E332A" stroke-width="6" />

  <!-- Classical Figurines on Scaffold -->
  <g transform="translate(520, 185)">
    <!-- Worker 1 -->
    <circle cx="10" cy="10" r="6" fill="#D3A78C" />
    <path d="M5 16 L 15 16 L 18 35 L 2 35 Z" fill="#FFFFFF" />
  </g>
  <g transform="translate(560, 185)">
    <!-- Worker 2 -->
    <circle cx="10" cy="10" r="6" fill="#C59B80" />
    <path d="M5 16 L 15 16 L 18 35 L 2 35 Z" fill="#8B4513" />
  </g>

  <!-- Foreground Water and Reflections -->
  <rect x="0" y="300" width="600" height="75" fill="#4A5658" opacity="0.85" />
  <path d="M0 320 Q 150 315, 300 322 T 600 318" stroke="#D0DFE2" stroke-width="2" opacity="0.5" fill="none" />
  <path d="M0 345 Q 150 340, 300 348 T 600 342" stroke="#90A6AA" stroke-width="1.5" opacity="0.4" fill="none" />
</svg>

